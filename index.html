  function pad(n) { return n < 10 ? "0" + n : "" + n; }
  function key(d) { return d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate()); }
  function parseK(k) { var p = k.split("-"); return new Date(+p[0], +p[1] - 1, +p[2]); }
  function today() { var d = new Date(); return new Date(d.getFullYear(), d.getMonth(), d.getDate()); }

  function nid() { return "i" + (Date.now().toString(36)) + (uid++).toString(36); }
  function hm(m) {
    m = Math.round(m || 0);
    if (m < 60) return m + " dk";
    var h = Math.floor(m / 60), r = m % 60;
    return r ? h + " sa " + r + " dk" : h + " sa";

  function blank() {
    return { v: 4, mt: 0, target: 900, log: {}, plan: {}, prog: {}, targets: {}, del: {}, lad: {}, yt: [], vid: [], notes: [], ytkey: "", cur: null };
  }

  function normalize(s) {
    var b = blank(), k;
    if (!s || typeof s !== "object") s = blank();
    for (k in b) if (!(k in s) || s[k] == null) s[k] = b[k];
    if (typeof s.target !== "number" || !isFinite(s.target)) s.target = 900;
    if (!Array.isArray(s.yt)) s.yt = [];
    if (!Array.isArray(s.vid)) s.vid = [];
    if (!Array.isArray(s.notes)) s.notes = [];
    s.vid.forEach(function (v) { if (typeof v.hoca !== "string") v.hoca = ""; });
    if (typeof s.ytkey !== "string") s.ytkey = "";
    s.yt = s.yt.filter(function (v) { return v && (v.vid || v.url); }).map(function (v) {
      if (!v.vid && v.url) {
        var c = ytParse(v.url);
        if (c) { v.vid = c.id; v.kind = c.kind; v.list = c.list || null; }
        if (!v.title || /^https?:\/\//i.test(v.title)) {
          v.title = c ? ((c.kind === "p" ? "Oynatma listesi " : "Video ") + c.id) : v.url;
        }
      }
      return v;
    });
    /* eski "kayıtlı linkler" listesini video kütüphanesine taşı */
    if (s.yt.length) {
      s.yt.forEach(function (v) {
        var c = v.vid ? { kind: v.kind || "v", id: v.vid, list: v.list } : ytParse(v.url);
        if (!c) return;
        s.vid.push({ id: v.id || ("m" + s.vid.length), subj: "Diğer", kind: c.kind, vid: c.id,
                     list: c.list || null, title: v.title || ("Video " + c.id), hoca: "", added: "", watched: "" });
      });
      s.yt = [];
    }
    ["log", "plan", "prog", "targets", "del", "lad"].forEach(function (a) { if (typeof s[a] !== "object" || !s[a]) s[a] = {}; });
    /* eski iki merdiveni yeni yapıya taşı */
    if (Array.isArray(s.mathDone) || Array.isArray(s.mathNote)) {
      lane(s, "matematik", s.mathDone, s.mathNote); delete s.mathDone; delete s.mathNote;
    }
    if (Array.isArray(s.trDone) || Array.isArray(s.trNote)) {
      lane(s, "turkce", s.trDone, s.trNote); delete s.trDone; delete s.trNote;
    }
    LADDERS.forEach(function (L) {
      if (!s.lad[L.k]) s.lad[L.k] = { d: [], n: [] };
      if (!Array.isArray(s.lad[L.k].d)) s.lad[L.k].d = [];
      if (!Array.isArray(s.lad[L.k].n)) s.lad[L.k].n = [];
    });
    s.v = 4;
    return s;
  }

  function lane(s, k, d, n) {
    if (!s.lad[k]) s.lad[k] = { d: [], n: [] };
    var i;
    if (Array.isArray(d)) for (i = 0; i < d.length; i++) if (d[i] && !s.lad[k].d[i]) s.lad[k].d[i] = d[i];
    if (Array.isArray(n)) for (i = 0; i < n.length; i++) if (n[i] && !s.lad[k].n[i]) s.lad[k].n[i] = n[i];
  }

  function importData(file, mode, done) {
    var fr = new FileReader();
    fr.onload = function () {
      var inc;
      try { inc = JSON.parse(fr.result); } catch (e) { done("Dosya okunamadı — geçerli bir yedek değil."); return; }
      if (!inc || typeof inc !== "object" || !inc.log) { done("Bu dosya bu panelin yedeği değil."); return; }
      inc = normalize(inc);
      if (mode === "replace") {
        state = inc;
      } else {
        var k;
        for (k in inc.log) {
          if (!state.log[k]) state.log[k] = [];
          var seen = {};
          state.log[k].forEach(function (e) { seen[e.id] = 1; });
          inc.log[k].forEach(function (e) { if (e && e.id && !seen[e.id]) state.log[k].push(e); });
        }
        for (k in inc.plan) if (!state.plan[k]) state.plan[k] = inc.plan[k];
        for (k in inc.prog) if (!state.prog[k]) state.prog[k] = inc.prog[k];
        for (k in inc.targets) if (state.targets[k] == null) state.targets[k] = inc.targets[k];
        for (k in inc.lad) {
          if (!state.lad[k]) state.lad[k] = { d: [], n: [] };
          ["d", "n"].forEach(function (f) {
            (inc.lad[k][f] || []).forEach(function (v, ix) { if (v && !state.lad[k][f][ix]) state.lad[k][f][ix] = v; });
          });
        }
        var ys = {};
        state.yt.forEach(function (v) { ys[v.id] = 1; });
        (inc.yt || []).forEach(function (v) { if (v && v.id && !ys[v.id]) state.yt.push(v); });
        var vs = {};
        state.vid.forEach(function (v) { vs[v.id] = 1; });
        (inc.vid || []).forEach(function (v) { if (v && v.id && !vs[v.id]) state.vid.push(v); });
        var ns2 = {};
        state.notes.forEach(function (v) { ns2[v.id] = 1; });
        (inc.notes || []).forEach(function (v) { if (v && v.id && !ns2[v.id]) state.notes.push(v); });
        if (!state.ytkey && inc.ytkey) state.ytkey = inc.ytkey;
      }
      save();
      done("");
    };
    fr.onerror = function () { done("Dosya okunamadı."); };
    fr.readAsText(file);
  }

  /* ---------- derived ---------- */

  function entries(k) { return state.log[k] || []; }
  function addEntry(k, subj, min, src) {
    if (!(min > 0)) return;
    if (!state.log[k]) state.log[k] = [];
    state.log[k].push({ id: nid(), s: subj, m: Math.round(min), src: src || "manuel", t: new Date().getHours() + ":" + pad(new Date().getMinutes()) });
  }
  function dayTotal(k, subj) {
    var e = entries(k), n = 0;
    for (var i = 0; i < e.length; i++) if (!subj || e[i].s === subj) n += e[i].m;
    return n;
  }
  function weekStats(mk) {
    var d = parseK(mk), out = { total: 0, by: {} };
    for (var i = 0; i < 7; i++) {
      var dd = new Date(d); dd.setDate(d.getDate() + i);
      var e = entries(key(dd));
      for (var j = 0; j < e.length; j++) {
        out.total += e[j].m;
        out.by[e[j].s] = (out.by[e[j].s] || 0) + e[j].m;
      }
    }
    return out;
  }
  function targetFor(mk) {
    if (state.targets[mk] != null) return state.targets[mk];
    return state.target;
  }
  function streak(subj) {
    var d = today(), n = 0;
    if (!dayTotal(key(d), subj)) d.setDate(d.getDate() - 1);
    for (var i = 0; i < 500; i++) {
      if (dayTotal(key(d), subj)) { n++; d.setDate(d.getDate() - 1); } else break;
    }
    return n;
  }
  function progTotal(w) {
    var r = state.prog[w] || [], n = 0;
    for (var i = 0; i < r.length; i++) n += (+r[i].min || 0);
    return n;

  function progWeekTotal() { var n = 0; ORDER.forEach(function (w) { n += progTotal(w); }); return n; }

  /* --- youtube --- */
  /* Bir YouTube adresinden video ya da liste kimliğini çıkarır. */
  function ytParse(raw) {
    var u = (raw || "").trim();
    if (!u) return null;
    if (/^[A-Za-z0-9_-]{11}$/.test(u)) return { kind: "v", id: u };
    var m;
    m = u.match(/[?&]list=([A-Za-z0-9_-]+)/);
    var list = m ? m[1] : null;
    m = u.match(/[?&]v=([A-Za-z0-9_-]{11})/) ||
        u.match(/youtu\.be\/([A-Za-z0-9_-]{11})/) ||
        u.match(/\/embed\/([A-Za-z0-9_-]{11})/) ||
        u.match(/\/shorts\/([A-Za-z0-9_-]{11})/) ||
        u.match(/\/live\/([A-Za-z0-9_-]{11})/);
    if (m) return { kind: "v", id: m[1], list: list };
    if (list) return { kind: "p", id: list };
    return null;
  }

  function ytEmbed(c) {
    if (!c) return "";
    if (c.kind === "p") return "https://www.youtube.com/embed/videoseries?list=" + c.id + "&rel=0";
    return "https://www.youtube.com/embed/" + c.id + (c.list ? "?list=" + c.list + "&rel=0" : "?rel=0");
  }

  function ytWatch(c) {
    if (!c) return "https://www.youtube.com";
    if (c.kind === "p") return "https://www.youtube.com/playlist?list=" + c.id;
    return "https://www.youtube.com/watch?v=" + c.id + (c.list ? "&list=" + c.list : "");
  }

    var a = document.createElement("a");
    a.className = cls; a.href = href; a.target = "_blank"; a.rel = "noopener noreferrer";

    if (title) a.title = title;
    return a;
  }

  /* --- YouTube Data API (isteğe bağlı) --- */
  function apiKey() { return (state.ytkey || "").trim(); }

  function apiErr(err) {
    var m = (err && err.message) || "";
    var reason = err && err.errors && err.errors[0] ? (err.errors[0].reason || "") : "";
    if (/API keys are not supported/i.test(m))
      return "Projede YouTube Data API v3 etkin değil. Console → APIs & Services → Library → \"YouTube Data API v3\" → Enable. Anahtarı oluşturduğun projeyle aynı proje olmalı.";
    if (/has not been used in project|SERVICE_DISABLED/i.test(m) || reason === "accessNotConfigured")
      return "YouTube Data API v3 bu projede kapalı. Console'da Enable et, birkaç dakika sonra tekrar dene.";
    if (/API key not valid|API_KEY_INVALID/i.test(m))
      return "Anahtar geçersiz. Credentials → Create credentials → API key ile oluşturulmuş olmalı (OAuth client ID değil).";
    if (/referer|referrer/i.test(m) || reason === "ipRefererBlocked")
      return "Anahtarın site kısıtı bu adresi engelliyor. Credentials → anahtar → Application restrictions → Websites listesine bu adresi ekle ya da geçici olarak None yap.";
    if (/quota/i.test(m) || reason === "quotaExceeded")
      return "Günlük kota dolmuş. Yarın tekrar dene ya da videoları elle ekle.";
    if (/not found|playlistNotFound/i.test(m) || reason === "playlistNotFound")
      return "Playlist bulunamadı. Gizli (private) listeler API ile okunamaz — listeyi \"Bağlantıya sahip olanlar\" yap.";
    return m || "API hatası.";
  }

  function fetchPlaylist(listId, cb) {
    var k = apiKey();
    if (!k) { cb("API anahtarı girilmemiş — aşağıdaki \"API anahtarı\" bölümünden ekle."); return; }
    var out = [], token = "", guard = 0;
    (function step() {
      if (guard++ > 10) { cb("", out); return; }
      var u = "https://www.googleapis.com/youtube/v3/playlistItems?part=snippet&maxResults=50&playlistId=" +
              encodeURIComponent(listId) + "&key=" + encodeURIComponent(k) + (token ? "&pageToken=" + token : "");
      fetch(u).then(function (r) { return r.json(); }).then(function (j) {
        if (j && j.error) { cb(apiErr(j.error)); return; }
        (j.items || []).forEach(function (it) {
          var sn = it.snippet || {}, rid = (sn.resourceId || {}).videoId;
          if (!rid) return;
          if (sn.title === "Private video" || sn.title === "Deleted video") return;
          out.push({ vid: rid, title: sn.title || rid });
        });
        if (j.nextPageToken) { token = j.nextPageToken; step(); }
        else cb("", out);
      })["catch"](function () { cb("Bağlantı kurulamadı — anahtarı ve interneti kontrol et."); });
    })();
  }

  function fetchTitle(id, cb) {
    var k = apiKey();
    if (!k) { cb(""); return; }
    fetch("https://www.googleapis.com/youtube/v3/videos?part=snippet&id=" + encodeURIComponent(id) + "&key=" + encodeURIComponent(k))
      .then(function (r) { return r.json(); })
      .then(function (j) { var it = (j.items || [])[0]; cb(it && it.snippet ? it.snippet.title : ""); })
      ["catch"](function () { cb(""); });
  }

      ph0.appendChild(el("div", "phn", "Oynatıcı boş"));
      ph0.appendChild(el("div", "phs", "Aşağıya bir video ya da playlist linki ekle, sonra listeden birine bas."));
      stage.appendChild(ph0);
    }
    c.appendChild(stage);

    if (cur) {
      var bar = el("div", "stagebar");
      bar.appendChild(el("div", "nowt", cur.title || (cur.kind === "p" ? "Oynatma listesi" : "Video")));
      var acts = el("div", "pomo-btns");
      acts.appendChild(extLink(ytWatch(cur), "YouTube'da aç", "btn"));
      acts.appendChild(btn("Kapat", "", function () { state.cur = null; save(); render(); }));
      bar.appendChild(acts);
      c.appendChild(bar);
    }

    /* ekleme */
    var addRow = el("div", "tuberow");
    var li = el("textarea"); li.className = "grow linkbox"; li.rows = 2;
    li.placeholder = "Video veya playlist linki — birden fazlaysa her satıra bir tane";
    var sSel = subjSelect(libSubj, function (v) { libSubj = v; });
    var hi2 = el("input"); hi2.type = "text"; hi2.placeholder = "Hoca (isteğe bağlı)"; hi2.style.width = "150px";
    hi2.value = libHoca; hi2.setAttribute("list", "hocalar");
    var dl = document.createElement("datalist"); dl.id = "hocalar";
    var seenH = {};
    state.vid.forEach(function (v) { if (v.hoca && !seenH[v.hoca]) { seenH[v.hoca] = 1; var o = el("option"); o.value = v.hoca; dl.appendChild(o); } });
    var ni = el("input"); ni.type = "text"; ni.placeholder = "Başlık (boşsa otomatik)"; ni.style.width = "170px";
    var lw = el("div", "warn-msg", libMsg);

    function addOne(c2, title, subj, hoca) {
      state.vid.push({ id: nid(), subj: subj, kind: c2.kind, vid: c2.id, list: c2.list || null,
                       title: title || ((c2.kind === "p" ? "Oynatma listesi " : "Video ") + c2.id),
                       hoca: hoca, added: key(new Date()), watched: "" });
    }

    function doAdd(expand) {
      var raw = (li.value || "").split(/[\s,]+/).filter(function (x) { return x; });
      var subj = libSubj, title = (ni.value || "").trim(), hoca = (hi2.value || "").trim();
      libHoca = hoca;

      /* birden fazla link yapıştırıldıysa hepsini sırayla ekle */
      if (!expand && raw.length > 1) {
        var have0 = {};
        state.vid.forEach(function (v) { have0[v.vid] = 1; });
        var ok = 0, bad = 0, dup = 0;
        raw.forEach(function (u) {
          var cc = ytParse(u);
          if (!cc) { bad++; return; }
          if (have0[cc.id]) { dup++; return; }
          have0[cc.id] = 1;
          addOne(cc, "", subj, hoca);
          ok++;
        });
        libOpen[subj] = 1;
        libMsg = ok + " video " + subj + " altına eklendi" +
                 (dup ? ", " + dup + " tanesi zaten vardı" : "") +
                 (bad ? ", " + bad + " satır okunamadı" : "") +
                 ". Başlıkları ✎ ile düzeltebilirsin.";
        save(); render();
        return;
      }

      var c2 = ytParse(raw[0] || "");
      if (!c2) { libMsg = "Geçerli bir YouTube video veya playlist linki değil."; render(); return; }
      var listId = c2.kind === "p" ? c2.id : c2.list;

      if (expand && listId) {
        libMsg = "Playlist okunuyor…"; lw.textContent = libMsg;
        fetchPlaylist(listId, function (err, items) {
          if (err) { libMsg = err; render(); return; }
          if (!items || !items.length) { libMsg = "Playlist boş göründü."; render(); return; }
          var have = {};
          state.vid.forEach(function (v) { have[v.vid] = 1; });
          var n = 0;
          items.forEach(function (it) {
            if (have[it.vid]) return;
            addOne({ kind: "v", id: it.vid }, it.title, subj, hoca);
            n++;
          });
          libOpen[subj] = 1;
          libMsg = n + " video " + subj + " altına eklendi" + (items.length - n > 0 ? " (" + (items.length - n) + " tanesi zaten vardı)" : "") + ".";
          save(); render();
        });
        return;
      }

      if (!title && c2.kind === "v") {
        libMsg = "";
        fetchTitle(c2.id, function (t) {
          addOne(c2, t, subj, hoca);
          libOpen[subj] = 1;
          libMsg = (t ? "\"" + t + "\"" : "Video") + " eklendi.";
          save(); render();
        });
        return;
      }
      addOne(c2, title, subj, hoca);
      libOpen[subj] = 1;
      libMsg = "Eklendi.";
      save(); render();
    }

    li.addEventListener("keydown", function (e) {
      if (e.key === "Enter" && (e.ctrlKey || e.metaKey)) { e.preventDefault(); doAdd(false); }
    });
    addRow.appendChild(li);
    addRow.appendChild(sSel);
    addRow.appendChild(hi2);
    addRow.appendChild(dl);
    addRow.appendChild(ni);
    addRow.appendChild(btn("Ekle", "pri", function () { doAdd(false); }));
    addRow.appendChild(btn("Playlist'i aç", "", function () { doAdd(true); }));
    c.appendChild(el("p", "hint", "Tek link ya da her satıra bir tane olmak üzere toplu link yapıştırabilirsin (Ctrl+Enter ile ekle). \"Playlist'i aç\" listeyi tek tek videolara ayırır — bunun için API anahtarı gerekir. Anahtarsız eklenen playlist tek satır olarak durur ve tıklayınca tüm listeyi sırayla oynatır."));
    c.appendChild(addRow);
    c.appendChild(lw);

    /* kütüphane */
    if (state.vid.length) {
      var tools = el("div", "libtools");
      tools.appendChild(btn(hideWatched ? "İzlenenleri göster" : "İzlenenleri gizle", "sm", function () { hideWatched = !hideWatched; render(); }));
      c.appendChild(tools);
    }

    var lib = el("div", "lib");
    var any = false;

    function videoRow(v, cur2) {
      var isCur = cur2 && cur2.id === v.vid;
      var row = el("div", "vrow" + (v.watched ? " done" : "") + (isCur ? " cur" : ""));

      var ck = el("div", "ck");
      ck.setAttribute("data-on", v.watched ? "1" : "0");
      ck.setAttribute("role", "checkbox");
      ck.setAttribute("aria-checked", v.watched ? "true" : "false");
      ck.setAttribute("tabindex", "0");
      ck.title = v.watched ? "İzlendi işaretini kaldır" : "İzlendi işaretle";
      function tw() { v.watched = v.watched ? "" : key(new Date()); save(); render(); }
      ck.addEventListener("click", tw);
      ck.addEventListener("keydown", function (ev) { if (ev.key === " " || ev.key === "Enter") { ev.preventDefault(); tw(); } });
      row.appendChild(ck);

      if (renaming === v.id) {
        var ri = el("input"); ri.type = "text"; ri.className = "vrename"; ri.value = v.title || ""; ri.placeholder = "Başlık";
        var rh = el("input"); rh.type = "text"; rh.className = "vrehoca"; rh.value = v.hoca || ""; rh.placeholder = "Hoca";
        var done2 = false;
        function commit() {
          if (done2) return; done2 = true;
          v.title = (ri.value || "").trim() || v.title;
          v.hoca = (rh.value || "").trim();
          renaming = null; save(); render();
        }
        function esc(ev) {
          if (ev.key === "Enter") { ev.preventDefault(); commit(); }
          if (ev.key === "Escape") { done2 = true; renaming = null; render(); }
        }
        ri.addEventListener("keydown", esc); rh.addEventListener("keydown", esc);
        row.appendChild(ri); row.appendChild(rh);
        row.appendChild(btn("Kaydet", "sm pri", commit));
        setTimeout(function () { ri.focus(); ri.select(); }, 0);
      } else {
        var t = el("button", "vtitle", v.title || v.vid);
        t.type = "button";
        t.title = "Panelde oynat";
        t.addEventListener("click", function () { playVid(v); });
        row.appendChild(t);

        if (v.kind === "p") row.appendChild(el("span", "vtag", "liste"));
        if (v.watched) row.appendChild(el("span", "dt", v.watched.slice(8) + " " + AYK[+v.watched.slice(5, 7) - 1]));

        var moveSel = el("select", "vmove");
        SUBJ.forEach(function (n2) { var o = el("option", null, n2); o.value = n2; if (n2 === v.subj) o.selected = true; moveSel.appendChild(o); });
        moveSel.title = "Dersi değiştir";
        moveSel.addEventListener("change", function () { v.subj = moveSel.value; libOpen[moveSel.value] = 1; save(); render(); });
        row.appendChild(moveSel);

        var rn = el("button", "nb", "✎");
        rn.type = "button"; rn.title = "Başlığı ve hocayı değiştir";
        rn.addEventListener("click", function () { renaming = v.id; render(); });
        row.appendChild(rn);
        row.appendChild(extLink(ytWatch({ kind: v.kind || "v", id: v.vid, list: v.list }), "↗", "yt", "YouTube'da aç"));
        row.appendChild(xbtn(function () {
          var ix = state.vid.indexOf(v);
          if (ix >= 0) state.vid.splice(ix, 1);
          save(); render();
        }, "Kütüphaneden sil"));
      }
      return row;
    }

    SUBJ.forEach(function (subj) {
      var all = state.vid.filter(function (v) { return v.subj === subj; });
      if (!all.length) return;
      var shown = hideWatched ? all.filter(function (v) { return !v.watched; }) : all;
      var w = 0;
      all.forEach(function (v) { if (v.watched) w++; });
      any = true;

      var det = el("details", "pday");
      det.open = !!libOpen[subj];
      det.addEventListener("toggle", function () { libOpen[subj] = det.open ? 1 : 0; });
      var sm = el("summary");
      sm.appendChild(el("span", null, subj));
      sm.appendChild(el("span", "tt" + (w ? " has" : ""), w + " / " + all.length + " izlendi"));
      det.appendChild(sm);

      var body = el("div", "pbody lad");

      /* hocaya göre grupla — ekleme sırası korunur, hocasızlar en sonda */
      var order = [], groups = {};
      all.forEach(function (v) {
        var h = v.hoca || "";
        if (!groups[h]) { groups[h] = []; order.push(h); }
        groups[h].push(v);
      });
      order.sort(function (a, b) { return (a === "" ? 1 : 0) - (b === "" ? 1 : 0); });

      if (!shown.length) body.appendChild(el("div", "empty", "Bu derste izlenmemiş video kalmadı."));

      order.forEach(function (h) {
        var list = groups[h];
        var vis = hideWatched ? list.filter(function (v) { return !v.watched; }) : list;
        if (!vis.length) return;
        var hw = 0;
        list.forEach(function (v) { if (v.watched) hw++; });

        var gh = el("div", "hgroup");
        if (renaming === "H:" + subj + ":" + h) {
          var gi = el("input"); gi.type = "text"; gi.className = "vrename"; gi.value = h; gi.placeholder = "Hoca adı";
          var gdone = false;
          function gcommit() {
            if (gdone) return; gdone = true;
            var nv = (gi.value || "").trim();
            list.forEach(function (v) { v.hoca = nv; });
            renaming = null; save(); render();
          }
          gi.addEventListener("keydown", function (ev) {
            if (ev.key === "Enter") { ev.preventDefault(); gcommit(); }
            if (ev.key === "Escape") { gdone = true; renaming = null; render(); }
          });
          gi.addEventListener("blur", gcommit);
          gh.appendChild(gi);
          setTimeout(function () { gi.focus(); gi.select(); }, 0);
        } else {
          gh.appendChild(el("span", "hname" + (h ? "" : " none"), h || "hoca girilmemiş"));
          gh.appendChild(el("span", "hcount", hw + " / " + list.length));
          var ge = el("button", "nb", "✎");
          ge.type = "button"; ge.title = "Hoca adını değiştir (bu grubun tamamı)";
          ge.addEventListener("click", function () { renaming = "H:" + subj + ":" + h; render(); });
          gh.appendChild(ge);
        }
        body.appendChild(gh);

        var wrap = el("div", "hvideos");
        vis.forEach(function (v) { wrap.appendChild(videoRow(v, cur)); });
        body.appendChild(wrap);
      });

      det.appendChild(body);
      lib.appendChild(det);
    });
    var libCard = el("div", "card prog");
    libCard.appendChild(lib);
    c.appendChild(libCard);

    /* api anahtarı */
    var kd = el("details", "keybox");
    kd.open = keyOpen;
    kd.addEventListener("toggle", function () { keyOpen = kd.open; });
    var ks = el("summary", null, "API anahtarı" + (apiKey() ? " · tanımlı" : " · yok (playlist açma kapalı)"));
    kd.appendChild(ks);
    var kb = el("div", "keybody");
    kb.appendChild(el("p", "hint", "Playlist'i tek tek videolara açmak ve başlıkları otomatik almak için ücretsiz bir YouTube Data API v3 anahtarı gerekiyor. Google Cloud Console'da proje aç → YouTube Data API v3'ü etkinleştir → API anahtarı oluştur. Anahtarı Google tarafında kendi Pages adresinle sınırla (HTTP referrer kısıtı). Anahtar yalnızca bu tarayıcıda saklanır, sayfanın kodunda yer almaz."));
    var kr = el("div", "tuberow");
    var ki = el("input"); ki.type = "text"; ki.className = "grow"; ki.placeholder = "AIza…"; ki.value = state.ytkey || "";
    ki.addEventListener("input", function () { state.ytkey = ki.value.trim(); save(); });
    kr.appendChild(ki);
    kr.appendChild(extLink("https://console.cloud.google.com/apis/credentials", "Console", "btn"));
    kb.appendChild(kr);
    kd.appendChild(kb);
    c.appendChild(kd);

    s.appendChild(c);
    return s;
  }

  /* --- defterler --- */
  var noteSubj = "Türkçe", noteId = null, noteQuery = "";

  function notesOf(subj) {
    return state.notes.filter(function (n) { return n.subj === subj; });
  }
  function noteById(id) {
    for (var i = 0; i < state.notes.length; i++) if (state.notes[i].id === id) return state.notes[i];
    return null;
  }
  function noteStamp(n) {
    if (!n.upd) return "";
    var d = parseK(n.upd.slice(0, 10));
    return d.getDate() + " " + AYK[d.getMonth()];
  }
  function newPage(subj) {
    var n = { id: nid(), subj: subj, title: "", body: "", upd: key(new Date()) };
    state.notes.unshift(n);
    noteId = n.id;
    save(); render();
    setTimeout(function () {
      var t = document.getElementById("noteTitle");
      if (t) t.focus();
    }, 0);
  }

  function secNotes() {
    var s = el("section");
    var total = state.notes.length;
    s.appendChild(head("Defterler", el("div", "eyebrow", total + " sayfa")));
    var c = el("div", "card notes");

    /* ders şeritleri */
    var tabs = el("div", "ntabs");
    SUBJ.forEach(function (subj) {
      var n = notesOf(subj).length;
      var t = el("button", "ntab" + (subj === noteSubj ? " on" : "") + (n ? " has" : ""));
      t.type = "button";
      t.appendChild(el("span", null, subj));
      if (n) t.appendChild(el("span", "nc", String(n)));
      t.addEventListener("click", function () {
        noteSubj = subj;
        var list = notesOf(subj);
        noteId = list.length ? list[0].id : null;
        render();
      });
      tabs.appendChild(t);
    });
    c.appendChild(tabs);

    var grid = el("div", "ngrid");

    /* sol: sayfa listesi */
    var side = el("div", "nside");
    var sq = el("input"); sq.type = "search"; sq.className = "nsearch"; sq.placeholder = "Sayfalarda ara…";
    sq.value = noteQuery;
    side.appendChild(sq);

    var listBox = el("div", "nlist");
    side.appendChild(listBox);

    function paintList() {
      listBox.textContent = "";
      var q = noteQuery.trim().toLocaleLowerCase("tr");
      var src = q
        ? state.notes.filter(function (n) {
            return ((n.title || "") + " " + (n.body || "")).toLocaleLowerCase("tr").indexOf(q) >= 0;
          })
        : notesOf(noteSubj);
      if (!src.length) {
        listBox.appendChild(el("div", "empty", q ? "Eşleşen sayfa yok." : "Bu defter boş. Aşağıdan yeni sayfa aç."));
        return;
      }
      src.forEach(function (n) {
        var b = el("button", "nitem" + (n.id === noteId ? " on" : ""));
        b.type = "button";
        var top = el("div", "nitop");
        top.appendChild(el("span", "nititle", n.title || "Adsız sayfa"));
        top.appendChild(el("span", "nidate", noteStamp(n)));
        b.appendChild(top);
        var prev = (n.body || "").replace(/\s+/g, " ").trim();
        b.appendChild(el("div", "niprev", prev ? prev.slice(0, 70) : "boş"));
        if (q && n.subj !== noteSubj) b.appendChild(el("span", "nisubj", n.subj));
        b.addEventListener("click", function () {
          noteId = n.id;
          noteSubj = n.subj;
          render();
          var ed = document.getElementById("noteBody");
          if (ed && window.innerWidth < 860) ed.scrollIntoView({ block: "center" });
        });
        listBox.appendChild(b);
      });
    }
    paintList();

    sq.addEventListener("input", function () { noteQuery = sq.value; paintList(); });
    side.appendChild(btn("+ Yeni sayfa", "pri", function () { newPage(noteSubj); }));
    grid.appendChild(side);

    /* sağ: yazma alanı */
    var main = el("div", "nmain");
    var cur = noteId ? noteById(noteId) : null;
    if (!cur) {
      var list0 = notesOf(noteSubj);
      cur = list0.length ? list0[0] : null;
      if (cur) noteId = cur.id;
    }

    if (!cur) {
      var ph = el("div", "nempty");
      ph.appendChild(el("div", "phn", noteSubj + " defteri boş"));
      ph.appendChild(el("div", "phs", "\"+ Yeni sayfa\" ile ilk sayfayı aç. Her ders kendi defterini tutar; arama kutusu bütün defterlerde birden arar."));
      main.appendChild(ph);
    } else {
      var page = cur;
      var htop = el("div", "nhead");
      var ti = el("input"); ti.type = "text"; ti.id = "noteTitle"; ti.className = "ntitle";
      ti.placeholder = "Sayfa başlığı — konu adı, tarih, ne istersen";
      ti.value = page.title || "";
      htop.appendChild(ti);

      var mv = el("select", "vmove");
      SUBJ.forEach(function (n2) { var o = el("option", null, n2); o.value = n2; if (n2 === page.subj) o.selected = true; mv.appendChild(o); });
      mv.title = "Sayfayı başka deftere taşı";
      mv.addEventListener("change", function () {
        page.subj = mv.value; noteSubj = mv.value; page.upd = key(new Date());
        save(); render();
      });
      htop.appendChild(mv);

      var del = { armed: false };
      var db = el("button", "nb", "sil");
      db.type = "button";
      db.addEventListener("click", function () {
        if (!del.armed) { del.armed = true; db.textContent = "emin misin?"; db.className = "nb warnbtn"; return; }
        var ix = state.notes.indexOf(page);
        if (ix >= 0) state.notes.splice(ix, 1);
        var rest = notesOf(noteSubj);
        noteId = rest.length ? rest[0].id : null;
        save(); render();
      });
      htop.appendChild(db);
      main.appendChild(htop);

      var ta = el("textarea"); ta.id = "noteBody"; ta.className = "nbody";
      ta.placeholder = "Buraya yaz. Formül, kural, hata, örnek soru — ne tutuyorsan.";
      ta.value = page.body || "";
      main.appendChild(ta);

      var foot = el("div", "nfoot");
      var cnt = el("span", null, "");
      function counts() {
        var b = ta.value || "";
        var words = b.trim() ? b.trim().split(/\s+/).length : 0;
        cnt.textContent = words + " kelime · " + b.length + " karakter" + (page.upd ? " · son " + noteStamp(page) : "");
      }
      counts();
      foot.appendChild(cnt);
      main.appendChild(foot);

      function touch() {
        page.upd = key(new Date());
        counts();
        saveSoon();
      }
      ti.addEventListener("input", function () {
        page.title = ti.value;
        var on = listBox.querySelector(".nitem.on .nititle");
        if (on) on.textContent = ti.value || "Adsız sayfa";
        touch();
      });
      ta.addEventListener("input", function () {
        page.body = ta.value;
        var onp = listBox.querySelector(".nitem.on .niprev");
        if (onp) {
          var pv = ta.value.replace(/\s+/g, " ").trim();
          onp.textContent = pv ? pv.slice(0, 70) : "boş";
        }
        touch();
      });
      ta.addEventListener("keydown", function (e) {
        if (e.key === "Tab") {
          e.preventDefault();
          var st = ta.selectionStart, en = ta.selectionEnd;
          ta.value = ta.value.slice(0, st) + "  " + ta.value.slice(en);
          ta.selectionStart = ta.selectionEnd = st + 2;
          page.body = ta.value; touch();
        }
      });
    }

    grid.appendChild(main);
    c.appendChild(grid);
    s.appendChild(c);
    return s;
  }

  /* --- yedekleme --- */
  var backupMsg = "";

  function secBackup() {
    var s = el("section");
    s.appendChild(head("Yedek"));
    var c = el("div", "card pad");
    var note = el("div", "warn-msg", backupMsg);
    var row = el("div", "tuberow");
    row.appendChild(btn("Dışa aktar (.json)", "pri", function () { exportData(); backupMsg = "Yedek indirildi."; note.textContent = backupMsg; }));

    var fi = document.createElement("input");
    fi.type = "file"; fi.accept = "application/json,.json"; fi.style.display = "none";
    var mode = "merge";
    fi.addEventListener("change", function () {
      if (!fi.files || !fi.files[0]) return;
      importData(fi.files[0], mode, function (err) { backupMsg = err || "Yedek yüklendi."; render(); });
      fi.value = "";
    });
    row.appendChild(fi);
    row.appendChild(btn("İçe aktar (birleştir)", "", function () { mode = "merge"; fi.click(); }));
    row.appendChild(btn("İçe aktar (üzerine yaz)", "", function () { mode = "replace"; fi.click(); }));
    c.appendChild(row);
    c.appendChild(el("p", "hint", "Kayıtlar bu tarayıcıda tutuluyor. Başka cihaza geçerken ya da tarayıcı verisini temizlemeden önce dışa aktar; yeni yerde içe aktar. \"Birleştir\" mevcut kayıtların üstüne ekler, \"üzerine yaz\" hepsini dosyadakiyle değiştirir."));
    c.appendChild(note);

    var danger = el("div", "addrow");
    var cf = { armed: false };
    var db = btn("Tüm çalışma geçmişini sil", "", function () {
      if (!cf.armed) { cf.armed = true; db.textContent = "Emin misin? Tekrar bas"; db.className = "btn danger"; return; }
      state.log = {}; state.targets = {}; state.plan = {};
      backupMsg = "Çalışma geçmişi silindi.";
      save(); render();
    });
    danger.appendChild(db);
    c.appendChild(danger);
    s.appendChild(c);
    return s;
  }

  /* ---------- boot ---------- */

  function boot() {
    app = document.getElementById("app");
    if (!app) { app = document.createElement("div"); app.id = "app"; document.body.appendChild(app); }
    state = loadState();
    restorePomo();
    render();
    try {
      var sy = sessionStorage.getItem("yks-scroll");
      if (sy) { window.scrollTo(0, +sy); sessionStorage.removeItem("yks-scroll"); }
