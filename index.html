      "Atatürkçülük ve Atatürk İlkeleri","Atatürk Dönemi Dış Politika","II. Dünya Savaşı ve Sonrası"] },
    { k: "cografya", nm: "Coğrafya", q: "TYT Coğrafya", items: [

      "Türkiye'nin İklimi","İç Kuvvetler ve Yer Şekilleri","Dış Kuvvetler","Türkiye'nin Yer Şekilleri",
      "Su, Toprak ve Bitki Örtüsü","Nüfus ve Yerleşme","Türkiye'de Nüfus ve Yerleşme",
      "Ekonomik Faaliyetler","Türkiye Ekonomisi","Bölgeler ve Ülkeler","Doğal Afetler ve Çevre"] },
    { k: "felsefe", nm: "Felsefe", q: "TYT Felsefe", items: [

      "Sanat Felsefesi","Din Felsefesi","Siyaset Felsefesi","Bilim Felsefesi","İlk Çağ Felsefesi",

    { k: "din", nm: "Din Kültürü", q: "TYT Din Kültürü", items: [
      "Bilgi ve İnanç","İslam ve İbadet","Ahlak ve Değerler","Din, Kültür ve Medeniyet",
      "Hz. Muhammed (S.A.V.)","Vahiy ve Akıl","İslam Düşüncesinde Yorumlar","Din, Kültür ve Sanat",
      "Gençlik ve Değerler","İslam ve Bilim","Yaşayan Dinler","Kur'an'dan Mesajlar"] }
  ];

  /* ---------- state ---------- */

  var state, saveTimer = null, ns = null, saveEl = null, uid = 0, calAll = false;
  var openNotes = {};
  var pomo = { endAt: 0, remain: 0, running: false, subj: "Matematik", total: 25, id: null };

  function pad(n) { return n < 10 ? "0" + n : "" + n; }
  function key(d) { return d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate()); }
  function parseK(k) { var p = k.split("-"); return new Date(+p[0], +p[1] - 1, +p[2]); }
  function today() { var d = new Date(); return new Date(d.getFullYear(), d.getMonth(), d.getDate()); }
  function monday(d) { var x = new Date(d); x.setDate(x.getDate() - ((x.getDay() + 6) % 7)); return x; }
  function nid() { return "i" + (Date.now().toString(36)) + (uid++).toString(36); }
  function hm(m) {
    m = Math.round(m || 0);
    if (m < 60) return m + " dk";
    var h = Math.floor(m / 60), r = m % 60;
    return r ? h + " sa " + r + " dk" : h + " sa";
  }

  function blank() {
    return { v: 4, mt: 0, target: 900, log: {}, plan: {}, prog: {}, targets: {}, del: {}, lad: {}, yt: [], vid: [], notes: [], chill: [], watch: [], words: [], embeds: [], seen: {}, ytkey: "", tmdbkey: "", gemkey: "", gemmodel: "", cur: null, chillCur: null };
  }

  function normalize(s) {
    var b = blank(), k;
    if (!s || typeof s !== "object") s = blank();
    for (k in b) if (!(k in s) || s[k] == null) s[k] = b[k];
    if (typeof s.target !== "number" || !isFinite(s.target)) s.target = 900;
    if (!Array.isArray(s.yt)) s.yt = [];
    if (!Array.isArray(s.vid)) s.vid = [];
    if (!Array.isArray(s.notes)) s.notes = [];
    if (!Array.isArray(s.chill)) s.chill = [];
    if (!Array.isArray(s.watch)) s.watch = [];
    if (!Array.isArray(s.words)) s.words = [];
    if (!Array.isArray(s.embeds)) s.embeds = [];
    if (typeof s.seen !== "object" || !s.seen) s.seen = {};
    if (typeof s.gemkey !== "string") s.gemkey = "";
    if (typeof s.gemmodel !== "string" || !s.gemmodel) s.gemmodel = "gemini-2.0-flash";
    if (typeof s.tmdbkey !== "string") s.tmdbkey = "";
    s.vid.forEach(function (v) { if (typeof v.hoca !== "string") v.hoca = ""; });
    if (typeof s.ytkey !== "string") s.ytkey = "";
    s.yt = s.yt.filter(function (v) { return v && (v.vid || v.url); }).map(function (v) {
      if (!v.vid && v.url) {
        var c = ytParse(v.url);
        if (c) { v.vid = c.id; v.kind = c.kind; v.list = c.list || null; }
        if (!v.title || /^https?:\/\//i.test(v.title)) {
          v.title = c ? ((c.kind === "p" ? "Oynatma listesi " : "Video ") + c.id) : v.url;
        }
      }
      return v;
    });
    /* eski "kayıtlı linkler" listesini video kütüphanesine taşı */
    if (s.yt.length) {
      s.yt.forEach(function (v) {
        var c = v.vid ? { kind: v.kind || "v", id: v.vid, list: v.list } : ytParse(v.url);
        if (!c) return;
        s.vid.push({ id: v.id || ("m" + s.vid.length), subj: "Diğer", kind: c.kind, vid: c.id,
                     list: c.list || null, title: v.title || ("Video " + c.id), hoca: "", added: "", watched: "" });
      });
      s.yt = [];
    }
    ["log", "plan", "prog", "targets", "del", "lad"].forEach(function (a) { if (typeof s[a] !== "object" || !s[a]) s[a] = {}; });
    /* eski iki merdiveni yeni yapıya taşı */
    if (Array.isArray(s.mathDone) || Array.isArray(s.mathNote)) {
      lane(s, "matematik", s.mathDone, s.mathNote); delete s.mathDone; delete s.mathNote;
    }
    if (Array.isArray(s.trDone) || Array.isArray(s.trNote)) {
      lane(s, "turkce", s.trDone, s.trNote); delete s.trDone; delete s.trNote;
    }
    LADDERS.forEach(function (L) {
      if (!s.lad[L.k]) s.lad[L.k] = { d: [], n: [] };
      if (!Array.isArray(s.lad[L.k].d)) s.lad[L.k].d = [];
      if (!Array.isArray(s.lad[L.k].n)) s.lad[L.k].n = [];
      if (!Array.isArray(s.lad[L.k].x)) s.lad[L.k].x = [];
    });
    s.v = 4;
    return s;
  }

  function lane(s, k, d, n) {
    if (!s.lad[k]) s.lad[k] = { d: [], n: [], x: [] };
    var i;
    if (Array.isArray(d)) for (i = 0; i < d.length; i++) if (d[i] && !s.lad[k].d[i]) s.lad[k].d[i] = d[i];
    if (Array.isArray(n)) for (i = 0; i < n.length; i++) if (n[i] && !s.lad[k].n[i]) s.lad[k].n[i] = n[i];
  }

  function loadState() {
    var loc = null;
    try { var raw = localStorage.getItem(LSK); if (raw) loc = JSON.parse(raw); } catch (e) {}
    return normalize(loc);
  }

  function forget() {}

  /* ---------- kayıt ---------- */

  function msg(t) { if (saveEl) saveEl.textContent = t; }
  var msgTimer = null;

  function save() {
    state.mt = Date.now();
    try {
      localStorage.setItem(LSK, JSON.stringify(state));
      msg("kaydedildi");
    } catch (e) {
      msg("kaydedilemedi — tarayıcı deposu dolu veya kapalı");
      return;
    }
    if (msgTimer) clearTimeout(msgTimer);
    msgTimer = setTimeout(function () { msg(""); }, 2500);
  }

  var soonTimer = null;
  function saveSoon() {
    msg("yazılıyor…");
    if (soonTimer) clearTimeout(soonTimer);
    soonTimer = setTimeout(function () { save(); }, 700);
  }

  function exportData() {
    var blob = new Blob([JSON.stringify(state, null, 2)], { type: "application/json" });
    var url = URL.createObjectURL(blob);
    var a = document.createElement("a");
    var d = new Date();
    a.href = url;
    a.download = "calisma-paneli-" + key(d) + ".json";
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(function () { URL.revokeObjectURL(url); }, 4000);
  }

  function importData(file, mode, done) {
    var fr = new FileReader();
    fr.onload = function () {
      var inc;
      try { inc = JSON.parse(fr.result); } catch (e) { done("Dosya okunamadı — geçerli bir yedek değil."); return; }
      if (!inc || typeof inc !== "object" || !inc.log) { done("Bu dosya bu panelin yedeği değil."); return; }
      inc = normalize(inc);
      if (mode === "replace") {
        state = inc;
      } else {
        var k;
        for (k in inc.log) {
          if (!state.log[k]) state.log[k] = [];
          var seen = {};
          state.log[k].forEach(function (e) { seen[e.id] = 1; });
          inc.log[k].forEach(function (e) { if (e && e.id && !seen[e.id]) state.log[k].push(e); });
        }
        for (k in inc.plan) if (!state.plan[k]) state.plan[k] = inc.plan[k];
        for (k in inc.prog) if (!state.prog[k]) state.prog[k] = inc.prog[k];
        for (k in inc.targets) if (state.targets[k] == null) state.targets[k] = inc.targets[k];
        for (k in inc.lad) {
          if (!state.lad[k]) state.lad[k] = { d: [], n: [] };
          ["d", "n"].forEach(function (f) {
            (inc.lad[k][f] || []).forEach(function (v, ix) { if (v && !state.lad[k][f][ix]) state.lad[k][f][ix] = v; });
          });
        }
        var ys = {};
        state.yt.forEach(function (v) { ys[v.id] = 1; });
        (inc.yt || []).forEach(function (v) { if (v && v.id && !ys[v.id]) state.yt.push(v); });
        var vs = {};
        state.vid.forEach(function (v) { vs[v.id] = 1; });
        (inc.vid || []).forEach(function (v) { if (v && v.id && !vs[v.id]) state.vid.push(v); });
        var ns2 = {};
        state.notes.forEach(function (v) { ns2[v.id] = 1; });
        (inc.notes || []).forEach(function (v) { if (v && v.id && !ns2[v.id]) state.notes.push(v); });
        [["chill", "chill"], ["watch", "watch"], ["words", "words"], ["embeds", "embeds"]].forEach(function (pair) {
          var seen3 = {};
          state[pair[0]].forEach(function (v) { seen3[v.id] = 1; });
          (inc[pair[1]] || []).forEach(function (v) { if (v && v.id && !seen3[v.id]) state[pair[0]].push(v); });
        });
        if (!state.tmdbkey && inc.tmdbkey) state.tmdbkey = inc.tmdbkey;
        if (!state.gemkey && inc.gemkey) state.gemkey = inc.gemkey;
        for (var sk in (inc.seen || {})) if (!state.seen[sk]) state.seen[sk] = inc.seen[sk];
        if (!state.ytkey && inc.ytkey) state.ytkey = inc.ytkey;
      }
      save();
      done("");
    };
    fr.onerror = function () { done("Dosya okunamadı."); };
    fr.readAsText(file);
  }

  /* ---------- derived ---------- */

  function entries(k) { return state.log[k] || []; }
  function addEntry(k, subj, min, src) {
    if (!(min > 0)) return;
    if (!state.log[k]) state.log[k] = [];
    state.log[k].push({ id: nid(), s: subj, m: Math.round(min), src: src || "manuel", t: new Date().getHours() + ":" + pad(new Date().getMinutes()) });
  }
  function dayTotal(k, subj) {
    var e = entries(k), n = 0;
    for (var i = 0; i < e.length; i++) if (!subj || e[i].s === subj) n += e[i].m;
    return n;
  }
  function weekStats(mk) {
    var d = parseK(mk), out = { total: 0, by: {} };
    for (var i = 0; i < 7; i++) {
      var dd = new Date(d); dd.setDate(d.getDate() + i);
      var e = entries(key(dd));
      for (var j = 0; j < e.length; j++) {
        out.total += e[j].m;
        out.by[e[j].s] = (out.by[e[j].s] || 0) + e[j].m;
      }
    }
    return out;
  }
  function targetFor(mk) {
    if (state.targets[mk] != null) return state.targets[mk];
    return state.target;
  }
  function streak(subj) {
    var d = today(), n = 0;
    if (!dayTotal(key(d), subj)) d.setDate(d.getDate() - 1);
    for (var i = 0; i < 500; i++) {
      if (dayTotal(key(d), subj)) { n++; d.setDate(d.getDate() - 1); } else break;
    }
    return n;
  }
  function progTotal(w) {
    var r = state.prog[w] || [], n = 0;
    for (var i = 0; i < r.length; i++) n += (+r[i].min || 0);
    return n;
  }
  function progWeekTotal() { var n = 0; ORDER.forEach(function (w) { n += progTotal(w); }); return n; }

  /* ---------- dom helpers ---------- */

  function el(t, c, x) { var e = document.createElement(t); if (c) e.className = c; if (x != null) e.textContent = x; return e; }
  function btn(txt, cls, fn) { var b = el("button", "btn " + (cls || ""), txt); b.type = "button"; b.addEventListener("click", fn); return b; }
  function xbtn(fn, title) { var b = el("button", "x", "×"); b.type = "button"; b.title = title || "Sil"; b.addEventListener("click", fn); return b; }
  function head(t, extra) {
    var d = el("div", "shead");
    d.appendChild(el("h2", null, t));
    d.appendChild(el("div", "rule"));
    if (extra) d.appendChild(extra);
    return d;
  }
  function subjSelect(val, fn) {

    var hrs = Math.floor(pomo.total / 60), mns = pomo.total % 60;

    var ih = el("input"); ih.type = "number"; ih.min = "0"; ih.max = "12"; ih.value = hrs; ih.style.width = "76px";
    f2.appendChild(ih); top.appendChild(f2);

    var f3 = el("div", "fld");

    f3.appendChild(im); top.appendChild(f3);

    function readInputs() {
      var t = (Math.max(0, +ih.value || 0)) * 60 + (Math.max(0, +im.value || 0));
      pomo.total = t;
      if (!pomo.running) { pomo.remain = t * 60; paint(); }
      savePomo();
    }
    ih.addEventListener("input", readInputs);
    im.addEventListener("input", readInputs);

    var f4 = el("div", "fld");
    f4.appendChild(el("label", null, "Hazır süreler"));
    var pr = el("div", "presets");
    [15, 25, 40, 50, 90].forEach(function (m) {
      pr.appendChild(btn(m + " dk", "sm", function () {
        pomo.total = m; ih.value = 0; im.value = m;
        stop(); pomo.remain = m * 60; paint(); savePomo();
      }));
    });
    f4.appendChild(pr);
    top.appendChild(f4);
    c.appendChild(top);

    var run = el("div", "pomo-run");
    var clock = el("div", "clock");
    run.appendChild(clock);
    var bs = el("div", "pomo-btns");
    var go = btn("Başlat", "pri", function () {
      if (pomo.running) { stop(); go.textContent = "Devam"; }
      else {
        if (pomo.remain <= 0) pomo.remain = pomo.total * 60;
        if (pomo.remain <= 0) return;
        pomo.endAt = Date.now() + pomo.remain * 1000;
        pomo.running = true;
        pomo.id = setInterval(tick, 250);
        go.textContent = "Duraklat";
      }
      savePomo(); paint();
    });
    bs.appendChild(go);
    bs.appendChild(btn("Sıfırla", "", function () {
      stop(); pomo.remain = pomo.total * 60; go.textContent = "Başlat"; savePomo(); paint();
    }));
    bs.appendChild(btn("Bitir ve kaydet", "", function () {
      var done = Math.round((pomo.total * 60 - Math.max(0, pomo.remain)) / 60);
      stop(); pomo.remain = pomo.total * 60; go.textContent = "Başlat"; savePomo();
      if (done > 0) { addEntry(tk, pomo.subj, done, "pomodoro"); save(); render(); }
      else paint();
    }));
    run.appendChild(bs);
    c.appendChild(run);

    var mm = el("div", "pomo-msg", "");
    c.appendChild(mm);

    function paint() {
      var r = Math.max(0, pomo.remain);
      var h = Math.floor(r / 3600), m = Math.floor((r % 3600) / 60), sec = r % 60;
      clock.textContent = (h > 0 ? h + ":" + pad(m) : pad(m)) + ":" + pad(sec);
      clock.className = "clock" + (pomo.running ? " run" : (r === 0 && pomo.total > 0 ? " end" : ""));
      go.textContent = pomo.running ? "Duraklat" : (pomo.remain < pomo.total * 60 && pomo.remain > 0 ? "Devam" : "Başlat");
    }
    function stop() {
      if (pomo.id) { clearInterval(pomo.id); pomo.id = null; }
      if (pomo.running) pomo.remain = Math.max(0, Math.round((pomo.endAt - Date.now()) / 1000));
      pomo.running = false;
    }
    function tick() {
      pomo.remain = Math.max(0, Math.round((pomo.endAt - Date.now()) / 1000));
      if (pomo.remain <= 0) {
        var t = pomo.total;
        stop(); pomo.remain = 0; savePomo();
        addEntry(key(new Date()), pomo.subj, t, "pomodoro");
        save();
        try { document.title = "✓ " + pomo.subj + " · Sabah Bloğu"; } catch (e) {}
        render();
        return;
      }
      paint();
    }

    pomoTick = tick; pomoPaint = paint;
    if (pomo.running) { if (pomo.id) clearInterval(pomo.id); pomo.id = setInterval(tick, 250); }
    paint();

    var last = lastPomo();
    if (last) mm.textContent = "son pomodoro: " + last.s + " · " + last.m + " dk · " + last.t;

    s.appendChild(c);
    return s;
  }

  var pomoTick = null, pomoPaint = null;
  function lastPomo() {
    var e = entries(key(new Date()));
    for (var i = e.length - 1; i >= 0; i--) if (e[i].src === "pomodoro") return e[i];
    return null;
  }
  function savePomo() {
    try {
      sessionStorage.setItem("yks-pomo", JSON.stringify({ endAt: pomo.endAt, remain: pomo.remain, running: pomo.running, subj: pomo.subj, total: pomo.total }));
    } catch (e) {}
  }
  function restorePomo() {
    try {
      var r = JSON.parse(sessionStorage.getItem("yks-pomo") || "null");
      if (r) {
        pomo.subj = r.subj || pomo.subj;
        pomo.total = r.total || pomo.total;
        pomo.running = !!r.running;
        pomo.endAt = r.endAt || 0;
        pomo.remain = pomo.running ? Math.max(0, Math.round((pomo.endAt - Date.now()) / 1000)) : (r.remain != null ? r.remain : pomo.total * 60);
        if (pomo.running && pomo.remain <= 0) { pomo.running = false; pomo.remain = 0; }
      } else pomo.remain = pomo.total * 60;
    } catch (e) { pomo.remain = pomo.total * 60; }
  }

  /* --- geçmiş haftalar --- */
  function secHist(curMk) {
    var s = el("section");
    s.appendChild(head("Geçmiş haftalar"));
    var c = el("div", "card hist");
    var weeks = [], seen = {};
    Object.keys(state.log).forEach(function (k) {
      if (!state.log[k] || !state.log[k].length) return;
      var m = key(monday(parseK(k)));
      if (!seen[m]) { seen[m] = 1; weeks.push(m); }
    });
    if (!seen[curMk]) weeks.push(curMk);
    weeks.sort().reverse();

    var t = el("table");
    var th = el("thead"), hr = el("tr");
    ["Hafta", "Hedef", "Gerçekleşen", "Fark", "En çok"].forEach(function (x) { hr.appendChild(el("th", null, x)); });
    th.appendChild(hr); t.appendChild(th);
    var tb = el("tbody");
    if (!weeks.length) {
      var er = el("tr"), ed = el("td"); ed.colSpan = 5;
      ed.appendChild(el("div", "empty", "Henüz geçmiş yok."));
      er.appendChild(ed); tb.appendChild(er);
    }
    weeks.slice(0, 26).forEach(function (m) {
      var st = weekStats(m), tg = targetFor(m);
      var d1 = parseK(m), d2 = new Date(d1); d2.setDate(d1.getDate() + 6);
      var top = "", topv = 0;
      for (var k in st.by) if (st.by[k] > topv) { topv = st.by[k]; top = k; }
      var tr = el("tr", m === curMk ? "cur" : "");
      tr.appendChild(el("td", "n", d1.getDate() + " " + AYK[d1.getMonth()] + " – " + d2.getDate() + " " + AYK[d2.getMonth()]));
      tr.appendChild(el("td", "n", hm(tg)));
      tr.appendChild(el("td", "n", hm(st.total)));
      var diff = st.total - tg;
      var dt = el("td", "n");
      var sp = el("span", diff >= 0 ? "ok" : "no", (diff >= 0 ? "+" : "−") + hm(Math.abs(diff)));
      dt.appendChild(sp); tr.appendChild(dt);
      tr.appendChild(el("td", null, top ? top + " · " + hm(topv) : "—"));
      tb.appendChild(tr);
    });
    t.appendChild(tb);
    c.appendChild(t);
    s.appendChild(c);
    return s;
  }

  /* --- YouTube yardımcıları --- */
  function ytParse(raw) {
    var u = (raw || "").trim();
    if (!u) return null;
    if (/^[A-Za-z0-9_-]{11}$/.test(u)) return { kind: "v", id: u };
    var m;
    m = u.match(/[?&]list=([A-Za-z0-9_-]+)/);
    var list = m ? m[1] : null;
    m = u.match(/[?&]v=([A-Za-z0-9_-]{11})/) ||
        u.match(/youtu\.be\/([A-Za-z0-9_-]{11})/) ||
        u.match(/\/embed\/([A-Za-z0-9_-]{11})/) ||
        u.match(/\/shorts\/([A-Za-z0-9_-]{11})/) ||
        u.match(/\/live\/([A-Za-z0-9_-]{11})/);
    if (m) return { kind: "v", id: m[1], list: list };
    if (list) return { kind: "p", id: list };
    return null;
  }

  function ytEmbed(c) {
    if (!c) return "";
    if (c.kind === "p") return "https://www.youtube.com/embed/videoseries?list=" + c.id + "&rel=0";
    return "https://www.youtube.com/embed/" + c.id + (c.list ? "?list=" + c.list + "&rel=0" : "?rel=0");
  }

  function ytWatch(c) {
    if (!c) return "https://www.youtube.com";
    if (c.kind === "p") return "https://www.youtube.com/playlist?list=" + c.id;
    return "https://www.youtube.com/watch?v=" + c.id + (c.list ? "&list=" + c.list : "");
  }

  function extLink(href, label, cls, title) {
    var a = document.createElement("a");
    a.className = cls; a.href = href; a.target = "_blank"; a.rel = "noopener noreferrer";
    a.textContent = label;
    if (title) a.title = title;
    return a;
  }

  /* --- YouTube Data API (isteğe bağlı) --- */
  function apiKey() { return (state.ytkey || "").trim(); }

  function apiErr(err) {
    var m = (err && err.message) || "";
    var reason = err && err.errors && err.errors[0] ? (err.errors[0].reason || "") : "";
    if (/API keys are not supported/i.test(m))
      return "Projede YouTube Data API v3 etkin değil. Console → APIs & Services → Library → \"YouTube Data API v3\" → Enable. Anahtarı oluşturduğun projeyle aynı proje olmalı.";
    if (/has not been used in project|SERVICE_DISABLED/i.test(m) || reason === "accessNotConfigured")
      return "YouTube Data API v3 bu projede kapalı. Console'da Enable et, birkaç dakika sonra tekrar dene.";
    if (/API key not valid|API_KEY_INVALID/i.test(m))
      return "Anahtar geçersiz. Credentials → Create credentials → API key ile oluşturulmuş olmalı (OAuth client ID değil).";
    if (/referer|referrer/i.test(m) || reason === "ipRefererBlocked")
      return "Anahtarın site kısıtı bu adresi engelliyor. Credentials → anahtar → Application restrictions → Websites listesine bu adresi ekle ya da geçici olarak None yap.";
    if (/quota/i.test(m) || reason === "quotaExceeded")
      return "Günlük kota dolmuş. Yarın tekrar dene ya da videoları elle ekle.";
    if (/not found|playlistNotFound/i.test(m) || reason === "playlistNotFound")
      return "Playlist bulunamadı. Gizli (private) listeler API ile okunamaz — listeyi \"Bağlantıya sahip olanlar\" yap.";
    return m || "API hatası.";
  }

  function fetchPlaylist(listId, cb) {
    var k = apiKey();
    if (!k) { cb("API anahtarı girilmemiş — aşağıdaki \"API anahtarı\" bölümünden ekle."); return; }
    var out = [], token = "", guard = 0;
    (function step() {
      if (guard++ > 10) { cb("", out); return; }
      var u = "https://www.googleapis.com/youtube/v3/playlistItems?part=snippet&maxResults=50&playlistId=" +
              encodeURIComponent(listId) + "&key=" + encodeURIComponent(k) + (token ? "&pageToken=" + token : "");
      fetch(u).then(function (r) { return r.json(); }).then(function (j) {
        if (j && j.error) { cb(apiErr(j.error)); return; }
        (j.items || []).forEach(function (it) {
          var sn = it.snippet || {}, rid = (sn.resourceId || {}).videoId;
          if (!rid) return;
          if (sn.title === "Private video" || sn.title === "Deleted video") return;
          out.push({ vid: rid, title: sn.title || rid });
        });
        if (j.nextPageToken) { token = j.nextPageToken; step(); }
        else cb("", out);
      })["catch"](function () { cb("Bağlantı kurulamadı — anahtarı ve interneti kontrol et."); });
    })();
  }

  function fetchTitle(id, cb) {
    var k = apiKey();
    if (!k) { cb(""); return; }
    fetch("https://www.googleapis.com/youtube/v3/videos?part=snippet&id=" + encodeURIComponent(id) + "&key=" + encodeURIComponent(k))
      .then(function (r) { return r.json(); })
      .then(function (j) { var it = (j.items || [])[0]; cb(it && it.snippet ? it.snippet.title : ""); })
      ["catch"](function () { cb(""); });
  }

  /* --- video kütüphanesi --- */

    c.appendChild(addRow);

  function say(text, lang) {

      window.speechSynthesis.cancel();
      var u = new SpeechSynthesisUtterance(text);
      u.lang = lang || "en-US";
      u.rate = 0.92;
      var vs = window.speechSynthesis.getVoices() || [];
      for (var i = 0; i < vs.length; i++) {
        if (vs[i].lang && vs[i].lang.toLowerCase().indexOf((lang || "en").slice(0, 2)) === 0) { u.voice = vs[i]; break; }
      }
      window.speechSynthesis.speak(u);
    } catch (e) {}
  }

  /* 1. katman: ücretsiz sözlük — anahtar yok */
  function dictLookup(word, cb) {
    fetch("https://api.dictionaryapi.dev/api/v2/entries/en/" + encodeURIComponent(word))
      .then(function (r) { return r.ok ? r.json() : null; })
      .then(function (j) {
        if (!j || !j.length) { cb(null); return; }
        var e0 = j[0], out = { word: e0.word || word, phonetic: e0.phonetic || "", audio: "", defs: [], syn: [] };
        (e0.phonetics || []).forEach(function (p2) {
          if (!out.audio && p2.audio) out.audio = p2.audio;
          if (!out.phonetic && p2.text) out.phonetic = p2.text;
        });
        (e0.meanings || []).forEach(function (m) {
          (m.definitions || []).slice(0, 2).forEach(function (d) {
            if (out.defs.length < 4) out.defs.push({ pos: m.partOfSpeech || "", def: d.definition || "", ex: d.example || "" });
          });
          (m.synonyms || []).slice(0, 4).forEach(function (sy) { if (out.syn.indexOf(sy) < 0 && out.syn.length < 6) out.syn.push(sy); });
        });
        cb(out);
      })["catch"](function () { cb(null); });
  }

  /* 2. katman: yapay zeka — Türkçe karşılık, örnek cümle, kalıplar */
  function aiLookup(word, cb) {
    var k = (state.gemkey || "").trim();
    if (!k) { cb("no-key"); return; }
    var model = (state.gemmodel || "gemini-2.0-flash").trim();
    var prompt = "İngilizce kelime: \"" + word + "\". Yanıtı SADECE şu JSON olarak ver, başka hiçbir şey yazma:\n" +
      '{"tr":"kısa Türkçe karşılık(lar), virgülle","level":"A1/A2/B1/B2/C1 tahmini",' +
      '"examples":[{"en":"örnek cümle","tr":"Türkçesi"},{"en":"","tr":""},{"en":"","tr":""}],' +
      '"collocations":[{"en":"yaygın kalıp","tr":"anlamı"},{"en":"","tr":""},{"en":"","tr":""},{"en":"","tr":""}],' +
      '"note":"varsa kısa kullanım notu, yoksa boş"}';
    fetch("https://generativelanguage.googleapis.com/v1beta/models/" + encodeURIComponent(model) +
          ":generateContent?key=" + encodeURIComponent(k), {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ contents: [{ parts: [{ text: prompt }] }],
        generationConfig: { temperature: 0.3, responseMimeType: "application/json" } })
    }).then(function (r) { return r.json(); }).then(function (j) {
      if (j && j.error) { cb("err:" + (j.error.message || "AI hatası")); return; }
      var t = "";
      try { t = j.candidates[0].content.parts[0].text; } catch (e) { cb("err:Beklenmedik yanıt."); return; }
      try { cb(JSON.parse(t)); } catch (e) {
        var m = t.match(/\{[\s\S]*\}/);
        if (m) { try { cb(JSON.parse(m[0])); return; } catch (e2) {} }
        cb("err:Yanıt çözülemedi.");
      }
    })["catch"](function () { cb("err:Bağlantı kurulamadı."); });
  }

  /* "Show.Name.S01E02.mp4", "1x02", "Season 2/Bolum 3" gibi adları çözer */
  function parseEpisode(name, path) {
    var base = name.replace(/\.[^.]+$/, "");
    var clean = base.replace(/[._]+/g, " ").trim();
    var m, se = null, ep = null, show = "";

    m = clean.match(/^(.*?)[\s\-]*[Ss](\d{1,2})[\s\-]*[Ee](\d{1,3})/);
    if (m) { show = m[1]; se = +m[2]; ep = +m[3]; }
    if (se === null) {
      m = clean.match(/^(.*?)[\s\-]*(\d{1,2})x(\d{1,3})\b/);
      if (m) { show = m[1]; se = +m[2]; ep = +m[3]; }
    }
    var parts = path.split("/");
    var parent = parts.length > 1 ? parts[parts.length - 2] : "";
    var grand = parts.length > 2 ? parts[parts.length - 3] : "";

    if (se === null) {
      var ps = parent.match(/(?:season|sezon|s)\s*[\.\-_]?\s*(\d{1,2})/i);
      if (ps) {
        se = +ps[1];
        show = grand || "";
        var pe = clean.match(/(?:b[oö]l[uü]m|episode|ep|e)\s*[\.\-_]?\s*(\d{1,3})/i) || clean.match(/(\d{1,3})\s*$/);
        ep = pe ? +pe[1] : null;
      }
    }
    if (se === null) { show = parent || ""; se = 1; var pe2 = clean.match(/(\d{1,3})/); ep = pe2 ? +pe2[1] : null; }

    show = (show || parent || "Diğer").replace(/[\s\-\.]+$/, "").trim();
    if (!show) show = "Diğer";
    show = show.split(/\s+/).map(function (w2) {
      return w2 ? w2.charAt(0).toLocaleUpperCase("tr") + w2.slice(1) : w2;
    }).join(" ");
    return { show: show, season: se || 1, ep: ep, title: clean };
  }

  function subKey(name) { return name.replace(/\.[^.]+$/, "").toLowerCase().replace(/[^a-z0-9]/g, ""); }

  function scanShows(dir) {
    shows.tree = {}; shows.subs = {}; shows.count = 0; shows.busy = true; shows.err = ""; render();
    var files = [];
    function walk(handle, prefix, depth, cb) {
      if (depth > 4) { cb(); return; }
      var it = handle.values ? handle.values() : null;
      if (!it) { cb(); return; }
      var pending = [];
      (function step() {
        it.next().then(function (r) {
          if (r.done) {
            if (!pending.length) { cb(); return; }
            var i = 0;
            (function nx() {
              if (i >= pending.length) { cb(); return; }
              var d = pending[i++];
              walk(d.h, prefix + d.n + "/", depth + 1, nx);
            })();
            return;
          }
          var e = r.value;
          if (e.kind === "directory") pending.push({ h: e, n: e.name });
          else if (VIDONLY.test(e.name)) files.push({ handle: e, name: e.name, path: prefix + e.name });
          else if (SUBEXT.test(e.name)) shows.subs[subKey(e.name)] = { handle: e, name: e.name };
          step();
        })["catch"](function () { cb(); });
      })();
    }
    walk(dir, "", 0, function () {
      files.forEach(function (f) {
        var info = parseEpisode(f.name, f.path);
        if (!shows.tree[info.show]) shows.tree[info.show] = {};
        if (!shows.tree[info.show][info.season]) shows.tree[info.show][info.season] = [];
        shows.tree[info.show][info.season].push({
          handle: f.handle, name: f.name, path: f.path,
          ep: info.ep, title: info.title, sub: shows.subs[subKey(f.name)] || null
        });
        shows.count++;
      });
      Object.keys(shows.tree).forEach(function (sh) {
        Object.keys(shows.tree[sh]).forEach(function (se) {
          shows.tree[sh][se].sort(function (a, b) {
            if (a.ep != null && b.ep != null) return a.ep - b.ep;
            return a.name.localeCompare(b.name, "tr");
          });
        });
      });
      shows.busy = false;
      render();
    });
  }

      if (loc.subLabel) c.appendChild(el("div", "eyebrow", "altyazı: " + loc.subLabel));
    } else if (cur) {
      var bar = el("div", "stagebar");
      bar.appendChild(el("div", "nowt", cur.title || "Çalıyor"));
      var acts = el("div", "pomo-btns");
      acts.appendChild(extLink(ytWatch(cur), "YouTube'da aç", "btn"));
      acts.appendChild(btn("Kapat", "", function () { state.chillCur = null; save(); render(); }));
      bar.appendChild(acts);
      c.appendChild(bar);
    }

    var row = el("div", "tuberow");
    var li = el("input"); li.type = "text"; li.className = "grow";
    li.placeholder = "YouTube linki — video ya da playlist";
    var ti = el("input"); ti.type = "text"; ti.placeholder = "Ad (isteğe bağlı)"; ti.style.width = "160px";
    var msgEl = el("div", "warn-msg", chillMsg);
    function addChill() {
      var c2 = ytParse(li.value);
      if (!c2) { chillMsg = "Geçerli bir YouTube linki değil."; render(); return; }
      state.chill.push({ id: nid(), kind: c2.kind, vid: c2.id, list: c2.list || null,
        title: (ti.value || "").trim() || ((c2.kind === "p" ? "Liste " : "Video ") + c2.id) });
      chillMsg = "Eklendi.";
      save(); render();
    }
    li.addEventListener("keydown", function (e) { if (e.key === "Enter") { e.preventDefault(); addChill(); } });
    row.appendChild(li); row.appendChild(ti);
    row.appendChild(btn("Ekle", "pri", addChill));
    c.appendChild(row);
    c.appendChild(msgEl);

    var box = el("div", "led");
    if (!state.chill.length) box.appendChild(el("div", "empty", "Liste boş. Çalışırken açtığın lo-fi, radyo, ne varsa buraya."));
    state.chill.forEach(function (v, i) {
      var d = el("div", "le");
      var t = el("button", "ytlink", v.title);
      t.type = "button";
      t.addEventListener("click", function () { playChill(v); });
      d.appendChild(t);
      if (v.kind === "p") d.appendChild(el("span", "vtag", "liste"));
      d.appendChild(extLink(ytWatch({ kind: v.kind, id: v.vid, list: v.list }), "↗", "yt", "YouTube'da aç"));
      d.appendChild(xbtn(function () { state.chill.splice(i, 1); save(); render(); }));
      box.appendChild(d);
    });
    c.appendChild(box);

    /* --- yerel dosyalar --- */
    c.appendChild(el("div", "sep"));
    var lrow = el("div", "tuberow");
    var fi2 = document.createElement("input");
    fi2.type = "file"; fi2.accept = "video/*,audio/*"; fi2.style.display = "none";
    fi2.addEventListener("change", function () {
      if (fi2.files && fi2.files[0]) playFile(fi2.files[0], fi2.files[0].name, "");
      fi2.value = "";
    });
    lrow.appendChild(fi2);
    lrow.appendChild(btn("Dosya aç", "", function () { fi2.click(); }));
    if (window.showDirectoryPicker) {
      lrow.appendChild(btn(loc.dir ? "Klasörü değiştir" : "Klasör bağla", "", bindFolder));
      if (loc.dir && !loc.need) lrow.appendChild(btn("Yenile", "sm", function () { listFolder(loc.dir); }));
    }
    c.appendChild(lrow);
    if (loc.err) c.appendChild(el("div", "warn-msg", loc.err));

    if (loc.need) {
      var nb2 = el("div", "tuberow");
      nb2.appendChild(el("span", "hint", "Bağlı klasör var ama tarayıcı her açılışta izin istiyor."));
      nb2.appendChild(btn("Klasöre erişim ver", "pri", grantFolder));
      c.appendChild(nb2);
    } else if (loc.files.length) {
      var fb2 = el("div", "led");
      loc.files.forEach(function (h) {
        var d = el("div", "le");
        var t2 = el("button", "ytlink" + (loc.playing === h.name ? " playing" : ""), h.name);
        t2.type = "button";
        t2.addEventListener("click", function () { playHandle(h); });
        d.appendChild(t2);
        fb2.appendChild(d);
      });
      c.appendChild(fb2);
      c.appendChild(el("p", "hint", loc.files.length + " dosya. Klasör bağlantısı hatırlanır, dosyalar kopyalanmaz — bilgisayarında oldukları yerde kalır."));
    } else if (loc.dir) {
      c.appendChild(el("div", "empty", "Bağlı klasörde oynatılabilir dosya yok."));
    } else {
      c.appendChild(el("p", "hint", "Bilgisayarındaki mp4/mp3 dosyalarını buradan açabilirsin. \"Klasör bağla\" dersen klasörü hatırlar, her seferinde seçmen gerekmez (Chromium tabanlı tarayıcılarda)."));
    }

    return c;
  }

  function chillShows() {
    var c = el("div", "cpane");

    var cur = state.chillCur;
    var stage = el("div", "stage");
    stage.id = "showPlayer";
    if (loc.url) {
      var vd = document.createElement("video");
      vd.id = "locVideo"; vd.src = loc.url; vd.controls = true; vd.className = "locvid";
      if (loc.sub) {
        var tr2 = document.createElement("track");
        tr2.kind = "subtitles"; tr2.label = "Altyazı"; tr2.srclang = "tr"; tr2.src = loc.sub; tr2["default"] = true;
        vd.appendChild(tr2);
        vd.addEventListener("loadedmetadata", function () {
          try { if (vd.textTracks && vd.textTracks[0]) vd.textTracks[0].mode = "showing"; } catch (e) {}
        });
      }
      vd.addEventListener("error", function () {
        var w = document.getElementById("codecWarn2");
        if (w) w.textContent = "Bu dosya tarayıcıda açılmadı — büyük ihtimalle mkv ya da HEVC. MP4'e çevirmen gerekiyor; README'de tek satırlık ffmpeg komutu var.";
      });
      stage.appendChild(vd);
    } else {
      var ph = el("div", "stage-ph on");
      ph.appendChild(el("div", "phn", "Boş"));
      ph.appendChild(el("div", "phs", "Klasörünü bağla, aşağıdan bir bölüm seç."));
      stage.appendChild(ph);
    }
    c.appendChild(stage);

    if (loc.url) {
      var bar = el("div", "stagebar");
      bar.appendChild(el("div", "nowt", loc.playing || "Oynatılıyor"));
      var acts = el("div", "pomo-btns");
      var sfi2 = document.createElement("input");
      sfi2.type = "file"; sfi2.accept = ".srt,.vtt,text/vtt"; sfi2.style.display = "none";
      sfi2.addEventListener("change", function () {
        if (!sfi2.files || !sfi2.files[0]) return;
        var f = sfi2.files[0];
        f.text().then(function (txt) {
          if (loc.sub) { try { URL.revokeObjectURL(loc.sub); } catch (e) {} }
          loc.sub = URL.createObjectURL(new Blob([toVtt(txt)], { type: "text/vtt" }));
          loc.subLabel = f.name; render();
        });
        sfi2.value = "";
      });
      acts.appendChild(sfi2);
      acts.appendChild(btn(loc.sub ? "Altyazı değiştir" : "Altyazı ekle", "", function () { sfi2.click(); }));
      acts.appendChild(btn("Kapat", "", function () {
        try { URL.revokeObjectURL(loc.url); } catch (e) {}
        if (loc.sub) { try { URL.revokeObjectURL(loc.sub); } catch (e) {} }
        loc.url = ""; loc.sub = ""; loc.subLabel = ""; loc.playing = null; render();
      }));
      bar.appendChild(acts);
      c.appendChild(bar);
      var cw2 = el("div", "warn-msg", ""); cw2.id = "codecWarn2";
      c.appendChild(cw2);
      if (loc.subLabel) c.appendChild(el("div", "eyebrow", "altyazı: " + loc.subLabel));
    }

    var row = el("div", "tuberow");
    row.appendChild(btn(shows.dir ? "Klasörü değiştir" : "Klasör bağla", "pri", bindShows));
    if (shows.dir && !shows.need) row.appendChild(btn(shows.busy ? "taranıyor…" : "Yeniden tara", "", function () { scanShows(shows.dir); }));
    c.appendChild(row);
    if (shows.err) c.appendChild(el("div", "warn-msg", shows.err));

    if (shows.need) {
      var nb = el("div", "tuberow");
      nb.appendChild(el("span", "hint", "Bağlı klasör var, tarayıcı izin bekliyor."));
      nb.appendChild(btn("Klasöre erişim ver", "pri", grantShows));
      c.appendChild(nb);
      return c;
    }

    if (!shows.dir) {
      c.appendChild(el("p", "hint", "İzleyeceğin dizileri bilgisayarında bir klasörde tut, o klasörü bir kez bağla. Panel dosya adlarından dizi / sezon / bölüm ağacını kendisi kurar. Altyazı dosyası (.srt veya .vtt) video ile aynı adı taşıyorsa otomatik yüklenir. Klasör hatırlanır, her açılışta yeniden seçmen gerekmez."));
      return c;
    }

    var names = Object.keys(shows.tree).sort(function (a, b) { return a.localeCompare(b, "tr"); });
    if (shows.busy) c.appendChild(el("div", "empty", "Klasör taranıyor…"));
    else if (!names.length) c.appendChild(el("div", "empty", "Klasörde video bulunamadı."));

    var lib = el("div", "lib");
    names.forEach(function (sh) {
      var seasons = shows.tree[sh];
      var seKeys = Object.keys(seasons).sort(function (a, b) { return +a - +b; });
      var totalEp = 0, watched = 0;
      seKeys.forEach(function (se) {
        seasons[se].forEach(function (it) { totalEp++; if (state.seen[it.path]) watched++; });
      });

      var det = el("details", "pday");
      det.open = !!showOpen[sh];
      det.addEventListener("toggle", function () { showOpen[sh] = det.open ? 1 : 0; });
      var sm = el("summary");
      sm.appendChild(el("span", null, sh));
      sm.appendChild(el("span", "tt" + (watched ? " has" : ""), watched + " / " + totalEp));
      det.appendChild(sm);

      var body = el("div", "pbody lad");
      seKeys.forEach(function (se) {
        var eps = seasons[se];
        var w2 = 0;
        eps.forEach(function (it) { if (state.seen[it.path]) w2++; });
        var skey = sh + "|" + se;

        var sdet = el("details", "hbox");
        sdet.open = !!seasonOpen[skey];
        sdet.addEventListener("toggle", function () { seasonOpen[skey] = sdet.open ? 1 : 0; });
        var ssum = el("summary", "hgroup");
        ssum.appendChild(el("span", "hname", se + ". Sezon"));
        ssum.appendChild(el("span", "hcount", w2 + " / " + eps.length));
        sdet.appendChild(ssum);

        var wrap = el("div", "hvideos");
        eps.forEach(function (it) {
          var seen = !!state.seen[it.path];
          var r2 = el("div", "vrow" + (seen ? " done" : "") + (loc.fileName === it.name ? " cur" : ""));
          var ck = el("div", "ck");
          ck.setAttribute("data-on", seen ? "1" : "0");
          ck.setAttribute("role", "checkbox");
          ck.setAttribute("tabindex", "0");
          ck.title = seen ? "İzlendi işaretini kaldır" : "İzlendi işaretle";
          function tw() {
            if (state.seen[it.path]) delete state.seen[it.path];
            else state.seen[it.path] = key(new Date());
            save(); render();
          }
          ck.addEventListener("click", tw);
          ck.addEventListener("keydown", function (ev) { if (ev.key === " " || ev.key === "Enter") { ev.preventDefault(); tw(); } });
          r2.appendChild(ck);

          var label = (it.ep != null ? it.ep + ". Bölüm" : it.title);
          var t2 = el("button", "vtitle", label);
          t2.type = "button";
          t2.title = it.name;
          t2.addEventListener("click", function () {
            playEpisode(it, sh, +se);
            var pl = document.getElementById("showPlayer");
            if (pl) pl.scrollIntoView({ block: "center" });
          });
          r2.appendChild(t2);
          if (it.sub) r2.appendChild(el("span", "vtag", "altyazı"));
          if (!VIDEXT.test(it.name)) r2.appendChild(el("span", "vtag", "?"));
          wrap.appendChild(r2);
        });
        sdet.appendChild(wrap);
        body.appendChild(sdet);
      });
      det.appendChild(body);
      lib.appendChild(det);
    });
    var libCard = el("div", "card prog");
    libCard.appendChild(lib);
    c.appendChild(libCard);
    c.appendChild(el("p", "hint", shows.count + " dosya tarandı. Bölüm adları yanlış gruplandıysa dosya adlarını 'Dizi Adı S01E02.mp4' biçimine getir ya da 'Dizi/Season 1/' klasör yapısı kullan."));
    return c;
  }

  function chillWatch() {
    var c = el("div", "cpane");

    /* arama */
    var srow = el("div", "tuberow");
    var q = el("input"); q.type = "text"; q.className = "grow";
    q.placeholder = "Dizi veya film ara (TMDB)";
    var wmsg = el("div", "warn-msg", watchMsg);
    function doSearch() {
      var text = (q.value || "").trim();
      if (!text) return;
      tmdbBusy = true; watchMsg = "aranıyor…"; render();
      tmdbSearch(text, function (err, res) {
        tmdbBusy = false;
        if (err) { watchMsg = err; tmdbResults = null; render(); return; }
        tmdbResults = res && res.length ? res : [];
        watchMsg = res && res.length ? "" : "Sonuç yok.";
        render();
      });
    }
    q.addEventListener("keydown", function (e) { if (e.key === "Enter") { e.preventDefault(); doSearch(); } });
    srow.appendChild(q);
    srow.appendChild(btn(tmdbBusy ? "…" : "Ara", "pri", doSearch));
    srow.appendChild(btn("Elle ekle", "", function () {
      state.watch.unshift({ id: nid(), type: "dizi", title: "", year: "", poster: "",
        platform: "Netflix", status: "izlenecek", season: 1, ep: 1, note: "" });
      watchMsg = "Boş kart eklendi — başlığını yaz.";
      save(); render();
    }));
    c.appendChild(srow);
    c.appendChild(wmsg);

    if (tmdbResults && tmdbResults.length) {
      var res = el("div", "tres");
      tmdbResults.forEach(function (r) {
        var b = el("button", "tcard");
        b.type = "button";
        var im = el("div", "tposter");
        if (r.poster) {
          var img = document.createElement("img"); img.src = r.poster; img.alt = ""; img.loading = "lazy";
          img.addEventListener("error", function () { im.textContent = ""; im.appendChild(el("span", "noposter", r.type)); });
          im.appendChild(img);
        } else im.appendChild(el("span", "noposter", r.type));
        b.appendChild(im);
        b.appendChild(el("div", "tname", r.title));
        b.appendChild(el("div", "tmeta", (r.year || "—") + " · " + r.type));
        b.addEventListener("click", function () {
          state.watch.unshift({ id: nid(), tmdb: r.tmdb, type: r.type, title: r.title, year: r.year,
            poster: r.poster, platform: "Netflix", status: "izlenecek", season: 1, ep: 1, note: "" });
          tmdbResults = null; watchMsg = r.title + " listeye eklendi.";
          save(); render();
        });
        res.appendChild(b);
      });
      c.appendChild(res);
      c.appendChild(btn("Sonuçları kapat", "sm", function () { tmdbResults = null; render(); }));
    }

    /* filtre */
    var fl = el("div", "chips");
    ["hepsi"].concat(WSTATUS).forEach(function (f) {
      var n = f === "hepsi" ? state.watch.length : state.watch.filter(function (w) { return w.status === f; }).length;
      var b = el("button", "chip" + (wFilter === f ? " on" : ""), f + " " + n);
      b.type = "button";
      b.addEventListener("click", function () { wFilter = f; render(); });
      fl.appendChild(b);
    });
    if (state.watch.length) c.appendChild(fl);

    /* liste */
    var shown = state.watch.filter(function (w) { return wFilter === "hepsi" || w.status === wFilter; });
    var grid = el("div", "wgrid");
    if (!shown.length) grid.appendChild(el("div", "empty", state.watch.length ? "Bu filtrede bir şey yok." : "İzleme listen boş. Yukarıdan ara ya da elle ekle."));
    shown.forEach(function (w) {
      var card = el("div", "wcard" + (w.status === "bitti" ? " done" : ""));

      var po = el("div", "wposter");
      if (w.poster) {
        var im2 = document.createElement("img"); im2.src = w.poster; im2.alt = ""; im2.loading = "lazy";
        im2.addEventListener("error", function () { po.textContent = ""; po.appendChild(el("span", "noposter", w.type)); });
        po.appendChild(im2);
      } else po.appendChild(el("span", "noposter", w.type));
      card.appendChild(po);

      var info = el("div", "winfo");
      var tin = el("input"); tin.type = "text"; tin.className = "wtitle"; tin.value = w.title || ""; tin.placeholder = "Başlık";
      tin.addEventListener("input", function () { w.title = tin.value; saveSoon(); });
      info.appendChild(tin);

      var meta = el("div", "wmeta");
      var ty = el("select", "wsel");
      ["dizi", "film"].forEach(function (t) { var o = el("option", null, t); o.value = t; if (t === w.type) o.selected = true; ty.appendChild(o); });
      ty.addEventListener("change", function () { w.type = ty.value; save(); render(); });
      meta.appendChild(ty);

      var pf = el("select", "wsel");
      PLATFORMS.forEach(function (t) { var o = el("option", null, t); o.value = t; if (t === w.platform) o.selected = true; pf.appendChild(o); });
      pf.addEventListener("change", function () { w.platform = pf.value; save(); });
      meta.appendChild(pf);

      var stl = el("select", "wsel");
      WSTATUS.forEach(function (t) { var o = el("option", null, t); o.value = t; if (t === w.status) o.selected = true; stl.appendChild(o); });
      stl.addEventListener("change", function () { w.status = stl.value; save(); render(); });
      meta.appendChild(stl);

      if (w.year) meta.appendChild(el("span", "wyear", w.year));
      info.appendChild(meta);

      if (w.type === "dizi") {
        var pr = el("div", "wprog");
        pr.appendChild(el("span", "plab", "S"));
        var si = el("input"); si.type = "number"; si.min = "1"; si.value = w.season || 1; si.className = "wnum";
        si.addEventListener("input", function () { w.season = +si.value || 1; saveSoon(); });
        pr.appendChild(si);
        pr.appendChild(el("span", "plab", "B"));
        var ei = el("input"); ei.type = "number"; ei.min = "1"; ei.value = w.ep || 1; ei.className = "wnum";
        ei.addEventListener("input", function () { w.ep = +ei.value || 1; saveSoon(); });
        pr.appendChild(ei);
        pr.appendChild(btn("+1 bölüm", "sm", function () { w.ep = (+w.ep || 1) + 1; w.status = "izliyorum"; save(); render(); }));
        info.appendChild(pr);
      }

      var nt = el("input"); nt.type = "text"; nt.className = "wnote"; nt.value = w.note || ""; nt.placeholder = "not";
      nt.addEventListener("input", function () { w.note = nt.value; saveSoon(); });
      info.appendChild(nt);
      card.appendChild(info);

      card.appendChild(xbtn(function () {
        var ix = state.watch.indexOf(w);
        if (ix >= 0) state.watch.splice(ix, 1);
        save(); render();
      }, "Listeden sil"));
      grid.appendChild(card);
    });
    c.appendChild(grid);

    /* tmdb anahtarı */
    var kd = el("details", "keybox");
    kd.appendChild(el("summary", null, "TMDB anahtarı" + ((state.tmdbkey || "").trim() ? " · tanımlı" : " · yok (arama kapalı)")));
    var kb = el("div", "keybody");
    kb.appendChild(el("p", "hint", "Başlık, yıl ve afiş bilgisi TMDB'den geliyor — ücretsiz. themoviedb.org'a üye ol → Ayarlar → API → API Key (v3 auth) al, buraya yapıştır. Anahtar yalnızca bu tarayıcıda saklanır. Anahtar olmadan da \"Elle ekle\" ile liste tutabilirsin, sadece afiş olmaz."));
    var kr = el("div", "tuberow");
    var ki = el("input"); ki.type = "text"; ki.className = "grow"; ki.placeholder = "TMDB API key (v3)"; ki.value = state.tmdbkey || "";
    ki.addEventListener("input", function () { state.tmdbkey = ki.value.trim(); saveSoon(); });
    kr.appendChild(ki);
    kr.appendChild(extLink("https://www.themoviedb.org/settings/api", "TMDB", "btn"));
    kb.appendChild(kr);
    kd.appendChild(kb);
    c.appendChild(kd);

    return c;
  }

  /* --- yedekleme --- */
  var backupMsg = "";

  function secBackup() {
    var s = el("section");
    s.appendChild(head("Yedek"));
    var c = el("div", "card pad");
    var note = el("div", "warn-msg", backupMsg);
    var row = el("div", "tuberow");
    row.appendChild(btn("Dışa aktar (.json)", "pri", function () { exportData(); backupMsg = "Yedek indirildi."; note.textContent = backupMsg; }));

    var fi = document.createElement("input");
    fi.type = "file"; fi.accept = "application/json,.json"; fi.style.display = "none";
    var mode = "merge";
    fi.addEventListener("change", function () {
      if (!fi.files || !fi.files[0]) return;
      importData(fi.files[0], mode, function (err) { backupMsg = err || "Yedek yüklendi."; render(); });
      fi.value = "";
    });
    row.appendChild(fi);
    row.appendChild(btn("İçe aktar (birleştir)", "", function () { mode = "merge"; fi.click(); }));
    row.appendChild(btn("İçe aktar (üzerine yaz)", "", function () { mode = "replace"; fi.click(); }));
    c.appendChild(row);
    c.appendChild(el("p", "hint", "Kayıtlar bu tarayıcıda tutuluyor. Başka cihaza geçerken ya da tarayıcı verisini temizlemeden önce dışa aktar; yeni yerde içe aktar. \"Birleştir\" mevcut kayıtların üstüne ekler, \"üzerine yaz\" hepsini dosyadakiyle değiştirir."));
    c.appendChild(note);

    var danger = el("div", "addrow");
    var cf = { armed: false };
    var db = btn("Tüm çalışma geçmişini sil", "", function () {
      if (!cf.armed) { cf.armed = true; db.textContent = "Emin misin? Tekrar bas"; db.className = "btn danger"; return; }
      state.log = {}; state.targets = {}; state.plan = {};
      backupMsg = "Çalışma geçmişi silindi.";
      save(); render();
    });
    danger.appendChild(db);
    c.appendChild(danger);
    s.appendChild(c);
    return s;
  }

  /* ---------- boot ---------- */

  function boot() {
    app = document.getElementById("app");
    if (!app) { app = document.createElement("div"); app.id = "app"; document.body.appendChild(app); }
    state = loadState();
    restorePomo();
    render();
    try {
      var sy = sessionStorage.getItem("yks-scroll");
      if (sy) { window.scrollTo(0, +sy); sessionStorage.removeItem("yks-scroll"); }
    } catch (e) {}
    if (window.claude && window.claude.use) {
      window.claude.use("artifact").then(function (n) { ns = n; })["catch"](function () {});
    }
  }

  if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", boot);
  else boot();
})();

</script>
